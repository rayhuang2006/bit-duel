name: Bit Duel referee
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

# Only trusted code checked out from the protected default branch.
permissions:
  contents: write
  issues: read

concurrency:
  group: bitduel-referee
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted referee dependencies
        run: python -m pip install -r requirements.txt
      - name: Load latest trusted main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Parse sealed comment and score when both submissions present
        env:
          ARENA_X25519_PRIVATE_KEY: ${{ secrets.ARENA_X25519_PRIVATE_KEY }}
          ARENA_SEED_HEX: ${{ secrets.ARENA_SEED_HEX }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            python -m bitduel.cli intake --event "$GITHUB_EVENT_PATH"
          else
            python -m bitduel.cli reconcile
          fi
      - name: Publish public receipts, limited scores, final reveal
        run: |
          git config user.name "bitduel-referee[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- submissions/ results/ reveal/
          if ! git diff --cached --quiet; then
            git commit -m "referee: record sealed submission and adjudication"
            git push origin main
          fi
